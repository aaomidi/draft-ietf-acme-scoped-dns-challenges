name: 'Netlify Preview Deploy'

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

# A newer push replaces the build of an older one, so that a slow old run can
# never overwrite a newer preview.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build the preview
    uses: ./.github/workflows/build.yml

  deploy:
    needs: 'build'
    name: 'Deploy'
    # A pull request from a fork has no access to the Netlify secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download Built Draft
        uses: actions/download-artifact@v4
        with:
          name: draft
          path: docs

      - name: Deploy preview to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          ALIAS: deploy-preview-${{ github.event.number }}
        run: |
          output=$(npx --yes netlify-cli@27.12.0 deploy \
            --dir=docs \
            --alias="$ALIAS" \
            --json)
          echo "$output"
          url=$(echo "$output" | jq -r '.deploy_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "Netlify did not return a deploy URL" >&2
            exit 1
          fi
          echo "deploy_url=$url" >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const url = process.env.DEPLOY_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              `📄 Draft preview: ${url}`,
              '',
              `[Text](${url}/draft.txt) · [XML](${url}/draft.xml) · built from ${sha}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
