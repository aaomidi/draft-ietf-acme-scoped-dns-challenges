name: 'Netlify Preview Deploy (Go tools)'

# Builds the draft with the Go tools in this repository alone, with no
# kramdown-rfc or xml2rfc, and publishes it next to the regular preview so
# that the two can be compared.

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

# A newer push replaces the build of an older one, so that a slow old run can
# never overwrite a newer preview.
concurrency:
  group: preview-next-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 'Build with Go tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout 📋
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run spellchecker
        uses: crate-ci/typos@v1.29.4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Generate 🔨
        run: |
          mkdir site
          go run ./cmd/mkd2xml -o site/draft.xml draft-ietf-acme-dns-account-challenge.mkd
          go run ./cmd/xml2txt -o site/draft.txt site/draft.xml
          go run ./cmd/xml2html -o site/index.html site/draft.xml

      - name: Store Output
        uses: actions/upload-artifact@v4
        with:
          name: draft-next
          path: site
          retention-days: 2

  deploy:
    needs: 'build'
    name: 'Deploy'
    # A pull request from a fork has no access to the Netlify secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download Built Draft
        uses: actions/download-artifact@v4
        with:
          name: draft-next
          path: site

      - name: Deploy preview to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          ALIAS: deploy-preview-${{ github.event.number }}-next
        run: |
          output=$(npx --yes netlify-cli@27.12.0 deploy \
            --dir=site \
            --alias="$ALIAS" \
            --json)
          echo "$output"
          url=$(echo "$output" | jq -r '.deploy_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "Netlify did not return a deploy URL" >&2
            exit 1
          fi
          echo "deploy_url=$url" >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.netlify.outputs.deploy_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- netlify-preview-next -->';
            const url = process.env.DEPLOY_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              `🧪 Draft preview built with the Go tools: ${url}`,
              '',
              `[Text](${url}/draft.txt) · [XML](${url}/draft.xml) · built from ${sha}`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
