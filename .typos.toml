[files]
extend-exclude = [
    ".devcontainer/",
    ".git/",
    ".github/",
    "vendor/",
    # Output of xml2rfc and files copied from it
    "internal/rfc/testdata/",
    "internal/rfc/assets/",
]
ignore-hidden = false


[default.extend-words]
# Secure Hash Standard
"SHS" = "SHS"
# RFCXML attribute holding a section's number
"pn" = "pn"
